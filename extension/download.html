<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Direct download · Downs</title>
    <link rel="stylesheet" href="download.css">
  </head>
  <body>
    <header class="page-header">
      <a class="brand" href="download.html" aria-label="Downs home">Downs</a>
    </header>

    <main>
      <h1>Direct download</h1>

      <section class="job-form" aria-label="Download settings">
        <div class="field">
          <span class="field-label">Source playlist</span>
          <div id="source" class="source-value" aria-label="Source playlist URL">Loading job…</div>
        </div>

        <label class="field" for="filename">
          <span class="field-label">Filename</span>
          <input id="filename" name="filename" type="text" autocomplete="off" spellcheck="false" disabled>
        </label>

        <div id="support" class="support-row">Checking support…</div>
        <p id="ready-status" class="ready-status" aria-live="polite">Loading download job…</p>
        <button id="start" class="primary-button" type="button" disabled>Start download</button>
        <p class="keep-open">Keep this tab open until the browser save finishes.</p>
      </section>

      <section id="activity" class="activity" aria-labelledby="activity-title" hidden>
        <div class="activity-head">
          <div>
            <h2 id="activity-title">Building MP4</h2>
            <p id="activity-detail">0 of 0 segments</p>
          </div>
          <button id="cancel" class="secondary-button" type="button">Cancel</button>
        </div>
        <progress id="progress" value="0" max="1">0%</progress>
        <p id="activity-meta" class="activity-meta">Starting…</p>
      </section>

      <section id="result" class="result" aria-live="polite" hidden>
        <div>
          <h2 id="result-title">Download not supported</h2>
          <p id="result-message"></p>
        </div>
        <button id="done" class="result-action" type="button" hidden>Done</button>
      </section>
    </main>

    <script src="download-core.js"></script>
    <script src="download.js"></script>
  </body>
</html>
