<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Downloads · Downs</title>
    <link rel="stylesheet" href="downloads.css">
  </head>
  <body>
    <header class="manager-header">
      <div class="manager-identity">
        <span class="brand">Downs</span>
        <h1>Downloads</h1>
      </div>
      <div class="manager-summary">
        <p id="summary" aria-live="polite">Loading downloads…</p>
        <div class="manager-tools">
          <button id="open-settings" class="text-action" type="button">Settings</button>
          <button id="clear-exported" class="text-action" type="button" hidden>Clear saved</button>
        </div>
      </div>
      <p id="manager-notice" class="manager-notice" role="status" hidden></p>
    </header>

    <main>
      <section id="jobs" class="job-list" aria-label="Downs download jobs"></section>
      <section id="empty" class="empty-state" hidden>
        <h2>No downloads yet</h2>
        <p>Start one from an inspected stream in the Downs popup.</p>
      </section>
    </main>

    <p id="announcer" class="visually-hidden" aria-live="polite"></p>

    <div id="settings-layer" class="settings-layer" hidden>
      <button id="settings-scrim" class="settings-scrim" type="button" aria-label="Close settings"></button>
      <aside class="settings-pane" role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <header class="settings-header">
          <h2 id="settings-title">Settings</h2>
          <button id="close-settings" class="close-settings" type="button" aria-label="Close settings">
            <span aria-hidden="true"></span>
          </button>
        </header>
        <fieldset class="filename-settings">
          <legend>File names</legend>
          <label class="setting-choice">
            <input type="radio" name="filename-mode" value="suggested">
            <span>Suggested title</span>
          </label>
          <label class="setting-choice">
            <input type="radio" name="filename-mode" value="date">
            <span>Date stamp <small id="date-example">2026-09-14_20-42.mp4</small></span>
          </label>
          <label class="setting-choice">
            <input type="radio" name="filename-mode" value="hash">
            <span>Random hash <small id="hash-example">k7m2p9x4qa.mp4</small></span>
          </label>
        </fieldset>
        <fieldset class="interface-settings">
          <legend>Interface</legend>
          <label class="setting-choice">
            <input id="show-full-urls" type="checkbox">
            <span>
              Show full URLs in stream list
              <small>Technical URLs always remain available in playlist details.</small>
            </span>
          </label>
        </fieldset>
        <p class="settings-note">Filename choice applies to new downloads. Interface preferences apply immediately.</p>
        <button id="settings-done" class="settings-done" type="button">Done</button>
      </aside>
    </div>

    <script src="job-core.js"></script>
    <script src="download-core.js"></script>
    <script src="downloads.js"></script>
  </body>
</html>
