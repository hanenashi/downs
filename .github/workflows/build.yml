name: Verify and package extension

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Test playlist parser
        run: node --test tests/*.test.js

      - name: Check extension source
        run: |
          node --check extension/hls-parser.js
          node --check extension/download-core.js
          node --check extension/download-worker.js
          node --check extension/download.js
          node --check extension/background.js
          node --check extension/popup.js
          node tools/validate-extension.mjs

      - name: Package Chromium and Firefox builds
        run: python3 tools/package_extensions.py

      - name: Verify archives
        run: |
          unzip -t dist/downs-chromium.zip
          unzip -t dist/downs-firefox.zip

      - name: Upload extension packages
        uses: actions/upload-artifact@v4
        with:
          name: downs-extension-packages
          path: dist/*.zip
